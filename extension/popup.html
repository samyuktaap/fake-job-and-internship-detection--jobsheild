<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobShield Extension</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      font-size: 20px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-scan {
      width: 100%;
      padding: 10px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-scan:hover {
      background: #15803d;
    }
    #result-box {
      margin-top: 12px;
      display: none;
    }
    .verdict-card {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .verdict-safe {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .verdict-danger {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
    }
    .verdict-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .risk-score {
      font-size: 12px;
      font-weight: 600;
    }
    .flags-list {
      margin: 8px 0 0 0;
      padding-left: 4px;
      list-style: none;
      font-size: 11px;
    }
    .signals-header-safe {
      font-size: 11.5px;
      font-weight: 700;
      color: #15803d;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .signals-header-danger {
      font-size: 11.5px;
      font-weight: 700;
      color: #b91c1c;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .signals-notes {
      font-size: 10.5px;
      font-weight: 600;
      color: #64748b;
      margin-top: 8px;
      margin-bottom: 3px;
    }
    .flag-item-green {
      color: #14532d;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .flag-item-red {
      color: #7f1d1d;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .flag-item-note {
      color: #475569;
      font-size: 10.5px;
      margin-bottom: 2px;
    }
    .ml-keywords {
      display: inline-block;
      background: rgba(22, 163, 74, 0.12);
      color: #15803d;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10.5px;
      margin-left: 2px;
    }
    .footer-note {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="logo-icon">🛡️</span>
      <h1 class="brand-title">JobShield</h1>
    </div>
    <div class="status-text">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-label">API Connected</span>
    </div>
  </div>

  <button id="btn-scan" class="btn-scan">
    <span>🔍</span>
    <span>Scan Current Job Listing</span>
  </button>

  <div id="result-box">
    <div id="verdict-card" class="verdict-card">
      <div id="verdict-title" class="verdict-title">Scanning...</div>
      <div id="risk-score" class="risk-score"></div>
      <ul id="flags-list" class="flags-list"></ul>
    </div>
  </div>

  <div class="footer-note">
    JobShield AI Model • Evaluates LinkedIn & Indeed Listings
  </div>

  <script src="popup.js"></script>
</body>
</html>
